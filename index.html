<!DOCTYPE html>
<html>
<head>
    <title>Pixel Progression</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Hybrid Platformer</h2>

<canvas id="gameCanvas" width="800" height="400"></canvas>

<div id="menu" class="panel">
    <h3>Pre-Level Choice</h3>
    <button onclick="chooseUpgrade('jump')">Jump Boost</button>
    <button onclick="chooseUpgrade('speed')">Speed Boost</button>
</div>

<div id="post" class="panel hidden">
    <h3>Level Complete</h3>
    <button onclick="postChoice('heal')">Heal +20</button>
    <button onclick="postChoice('next')">Next Level</button>
</div>

<p>Health: <span id="health">100</span></p>

<script src="game.js"></script>
</body>
</html>
